name: Publish documentation

on:
  push:
    branches:
      - main
    paths:
      - "robo_appian/**"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "robo_appian/**"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.5.1"

      - name: Install project and documentation dependencies
        run: poetry install --with docs --no-interaction

      - name: Build documentation with strict validation
        run: poetry run mkdocs build --strict

  publish:
    name: Publish gh-pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==2.5.1"

      - name: Install project and documentation dependencies
        run: poetry install --with docs --no-interaction

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish generated HTML to gh-pages
        run: poetry run mkdocs gh-deploy --force --clean
