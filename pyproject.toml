[project]
name = "robo-appian"
dynamic = ["version"]
description = "Reusable automation components for Appian applications."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dinil Mithra" },
]
maintainers = [
    { name = "Dinil Mithra" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright==1.63.0",
    "pytest==9.1.1",
    "robo-automation==0.1.8",
]

[project.scripts]
robo-appian = "robo_appian.cli:main"

[project.entry-points.pytest11]
robo_appian = "robo_appian.pytest_plugin"


[project.urls]
Documentation = "https://dinilmithra.github.io/robo-appian/"
Repository = "https://github.com/dinilmithra/robo-appian"
Issues = "https://github.com/dinilmithra/robo-appian/issues"
Developer = "https://www.linkedin.com/in/dinilmithra/"

[tool.poetry]
version = "0.1.22"
packages = [{ include = "robo_appian" }]
exclude = ["scripts/**", "tools/**"]

[tool.poetry.group.dev.dependencies]
black = "26.5.1"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.7"
mkdocstrings = {extras = ["python"], version = "^1.0.6"}

[tool.poetry.dependencies]
[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312"]
