[project]
name = "robo-appian"
dynamic = ["version"]
description = "Reusable Playwright components for Appian automation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright==1.63.0",
]

[tool.poetry]
version = "0.1.3"
packages = [{ include = "robo_appian" }]
exclude = ["scripts/**", "tools/**"]

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
black = "26.5.1"

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312"]
