[project]
name = "robo-appian"
dynamic = ["version"]
description = "Reusable Playwright components for Appian automation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dinil Mithra" },
]
maintainers = [
    { name = "Dinil Mithra" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright==1.63.0",
]

[project.urls]
Documentation = "https://dinilmithra.github.io/robo-appian/"
Repository = "https://github.com/dinilmithra/robo-appian"
Issues = "https://github.com/dinilmithra/robo-appian/issues"

[tool.poetry]
version = "0.1.14"
packages = [{ include = "robo_appian" }]
exclude = ["scripts/**", "tools/**"]

[tool.poetry.group.dev.dependencies]
black = "26.5.1"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.7"
mkdocstrings = {extras = ["python"], version = "^1.0.6"}

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312"]
