<!doctype html><html lang="en"><head><meta charset="utf-8"><title>RoboAppian recorder demo</title><style>body{font:15px system-ui;background:#f1f5f4;color:#173c35;margin:40px;max-width:800px}main{background:white;border:1px solid #d5e2dc;border-radius:12px;padding:25px}label{display:block;margin:15px 0 7px;font-weight:600}input,[role=combobox]{border:1px solid #b2c9c0;border-radius:5px;padding:10px;max-width:100%;width:430px;background:white;box-sizing:border-box}[role=combobox]{cursor:pointer}[role=option]{padding:9px;background:#e9f3ee;cursor:pointer}[role=option]:hover{background:#c6e5d6}[role=listbox]{width:430px}button{padding:10px 18px;border:0;border-radius:5px;background:#087e73;color:white;margin-top:15px;cursor:pointer}.note{color:#5f766d;font-size:13px}input[type=checkbox]{width:auto}#outcome{padding:15px;margin-top:18px;background:#e5f2eb}table{border-collapse:collapse}td,th{padding:10px;border:1px solid #c8d9d0;text-align:left}</style></head><body><h1>Create Execution Request</h1><p class="note">Local demonstration, not CORE. Start recording; select Phase and Category, enter a title, submit, then use Add verification and click the outcome. Review and approve each step.</p><main><label id="phase-label">Phase</label><div role="combobox" aria-labelledby="phase-label" aria-controls="phase-options" aria-expanded="false" tabindex="0">Select a Value</div><div role="listbox" id="phase-options" hidden></div><label id="category-label">Request Category</label><div role="combobox" aria-labelledby="category-label" aria-controls="category-options" aria-expanded="false" tabindex="0">Select a Value</div><div role="listbox" id="category-options" hidden></div><label for="request-title">Request Title</label><input id="request-title"><label for="request-date">Required Date</label><input id="request-date" data-testid="DatePickerWidget-textInput" placeholder="MM/DD/YYYY"><label><input type="checkbox" id="attachment"> Include attachment</label><button type="button" id="submit">SUBMIT</button><p id="outcome" role="status">Draft</p><section role="region" aria-labelledby="grid-title"><h2 id="grid-title">Request Overview</h2><table><thead><tr><th>Phase</th><th>Category</th></tr></thead><tbody><tr><td id="phase-cell">—</td><td id="category-cell">—</td></tr></tbody></table></section></main><script>
for(const [prefix,values] of [['phase',['Execution','Planning']],['category',['Contract','Misc']]]){const box=document.querySelector('[aria-controls="'+prefix+'-options"]'),list=document.getElementById(prefix+'-options');box.onclick=()=>{box.setAttribute('aria-expanded','true');list.hidden=false;list.replaceChildren();for(const value of values){const option=document.createElement('div');option.setAttribute('role','option');option.textContent=value;option.onclick=()=>{box.textContent=value;box.setAttribute('aria-expanded','false');list.hidden=true;};list.append(option);}};}
document.getElementById('submit').onclick=()=>{const phase=document.querySelector('[aria-controls="phase-options"]').textContent,category=document.querySelector('[aria-controls="category-options"]').textContent,title=document.getElementById('request-title').value.trim();document.getElementById('outcome').textContent=title&&phase==='Execution'&&category!=='Select a Value'?'Execution request created':'Complete the Execution phase, category and title.';document.getElementById('phase-cell').textContent=phase;document.getElementById('category-cell').textContent=category;};
</script></body></html>
