site_name: robo-appian
site_description: Reusable Playwright components for Appian UI automation

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            inherited_members: false
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

remote_branch: gh-pages
remote_name: origin

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
  - Guides:
      - Components: guides/components.md
      - Development: guides/development.md
      - Publishing Docs: guides/publishing-docs.md
  - API Reference:
      - Overview: api/index.md
      - Button: api/button.md
      - CheckBox: api/checkbox.md
      - Dropdown: api/dropdown.md
      - InputDate: api/input-date.md
      - InputText: api/input-text.md
      - Link: api/link.md
      - MenuButton: api/menu-button.md
      - RadioSelect: api/radio-select.md
      - RecordList: api/record-list.md
      - Region: api/region.md
      - SearchDropdown: api/search-dropdown.md
      - SearchInput: api/search-input.md
      - Tab: api/tab.md
      - Table: api/table.md
      - Text: api/text.md
      - ComponentUtils: api/component-utils.md
      - Scope: api/scope.md
