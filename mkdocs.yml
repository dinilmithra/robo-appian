site_name: robo-appian
site_description: Appian UI automation components and abstractions
copyright: Copyright &copy; 2026 Dinil Mithra

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/robo-appian-header-logo.png
  favicon: assets/images/robo-appian-icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            inherited_members: false
            filters:
              - "!^_"

markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

remote_branch: gh-pages
remote_name: origin

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Python Basics: getting-started/python-basics.md
      - Core Concepts: getting-started/concepts.md
      - Your First Test: getting-started/first-test.md
      - Choosing a Component: getting-started/component-basics.md
      - Troubleshooting: getting-started/troubleshooting.md
      - Handling Errors: getting-started/error-handling.md
  - Advanced / Framework Guides:
      - Framework Architecture: guides/framework-architecture.md
      - Pytest Integration: guides/pytest-integration.md
      - Browser Management: guides/browser-management.md
      - Components: guides/components.md
      - Development: guides/development.md
      - Publishing Docs: guides/publishing-docs.md
  - API Reference:
      - Overview: api/index.md
      - Appian Page and Locator: api/appian-page.md
      - Appian Scope: api/appian-scope.md
      - Appian Button: api/appian-button.md
      - Appian Textbox: api/appian-textbox.md
      - Appian Date: api/appian-date.md
      - Errors: api/errors.md
      - Components:
          - CheckBox: api/checkbox.md
          - Dropdown: api/dropdown.md
          - Link: api/link.md
          - MenuButton: api/menu-button.md
          - RecordList: api/record-list.md
          - Region: api/region.md
          - SearchDropdown: api/search-dropdown.md
          - SearchInput: api/search-input.md
          - Tab: api/tab.md
          - Table: api/table.md
          - ComponentUtils: api/component-utils.md
      - Compatibility:
          - Legacy Scope: api/scope.md
  - Command-Line Interface: api/cli.md
  - License: license.md
