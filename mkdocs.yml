site_name: robo-appian
site_description: Label-oriented Appian UI automation components built on Playwright
copyright: Copyright &copy; 2026 Dinil Mithra

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  logo: assets/images/robo-appian-header-logo.png
  favicon: assets/images/robo-appian-icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            inherited_members: false
            filters:
              - "!^_"

markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

remote_branch: gh-pages
remote_name: origin

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Core Concepts: getting-started/concepts.md
      - Quick Start: getting-started/quick-start.md
      - Your First Test: getting-started/first-test.md
      - Choosing a Component: getting-started/component-basics.md
      - Troubleshooting: getting-started/troubleshooting.md
  - License: license.md
  - API Reference:
      - Overview: api/index.md
      - RoboLocator: api/robo-locator.md
      - AppianElement: api/appian-element.md
      - Button: api/button.md
      - CheckBox: api/checkbox.md
      - Dropdown: api/dropdown.md
      - InputDate: api/input-date.md
      - InputText: api/input-text.md
      - Link: api/link.md
      - MenuButton: api/menu-button.md
      - RadioSelect: api/radio-select.md
      - RecordList: api/record-list.md
      - Region: api/region.md
      - SearchDropdown: api/search-dropdown.md
      - SearchInput: api/search-input.md
      - Tab: api/tab.md
      - Table: api/table.md
      - Text: api/text.md
      - ComponentUtils: api/component-utils.md
      - Scope: api/scope.md
